name: Deploy

# Manual only until M6 (see docs/roadmap.md). There is no Cloudflare account,
# D1 database or API token yet, so an automatic run on every merge to main would
# fail on every merge. At M6, uncomment the workflow_run trigger below.
on:
  # workflow_run:
  #   workflows: [CI]
  #   types: [completed]
  #   branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The Cloudflare Vite plugin writes the deploy configuration into
      # dist/captain_prospectus/wrangler.json; `wrangler deploy` picks it up.
      - run: pnpm run build
      # Migrations run BEFORE the new code, so every migration must work with
      # the currently deployed Worker (expand -> deploy -> contract).
      - name: Apply D1 migrations, then deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: |
            d1 migrations apply captain-prospectus --remote
            deploy
