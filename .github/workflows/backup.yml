name: Backup

# D1 holds the only copy of the data, and the project's loudest invariant is
# "never lose a visit". Time Travel covers accidents inside its retention
# window; this covers everything outside it.
# Manual only until M6: there is no database to export yet, and a weekly
# scheduled failure is noise nobody reads. Uncomment the schedule at M6.
on:
  # schedule:
  #   - cron: "17 3 * * 1" # Mondays, 03:17 UTC
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Export the production database
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 export captain-prospectus --remote --output=backup.sql
      - uses: actions/upload-artifact@v7
        with:
          name: d1-backup-${{ github.run_id }}
          path: backup.sql
          # Visit notes and agent positions are personal data (docs/security.md).
          retention-days: 90
