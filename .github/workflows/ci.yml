name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skip until the app is scaffolded
        id: scaffold
        run: echo "present=$([ -f package-lock.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.scaffold.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.scaffold.outputs.present == 'true'
        run: npm ci
      - if: steps.scaffold.outputs.present == 'true'
        run: npm run typecheck
      - if: steps.scaffold.outputs.present == 'true'
        run: npm test --if-present
      - if: steps.scaffold.outputs.present == 'true'
        run: npm run build
