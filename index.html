<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b2a4a" />

    <!--
      favicon.svg is deliberately not linked: it is a 251 kB PNG wrapped in an
      SVG, and browsers that prefer SVG would fetch it over the 15 kB .ico.
      iOS ignores the manifest for the home screen, hence apple-touch-icon.
    -->
    <link rel="icon" href="/favicon.ico" sizes="48x48 32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The manifest link is injected by vite-plugin-pwa; declaring it here too
         gives the page two of them. -->

    <title>Captain Prospectus</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/client/main.tsx"></script>
  </body>
</html>
